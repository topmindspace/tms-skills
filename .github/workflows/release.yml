name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: top-ppt-html/package-lock.json

      - name: Privacy scan
        run: python3 scripts/ci_privacy_scan.py

      # Same skill gates as CI (incl. lightweight regression fixture + smoke_pptx).
      - name: Skill gates (all discovered skills)
        run: bash scripts/ci_skill_gates.sh --with-pptx

      - name: Package all skills
        run: |
          set -euo pipefail
          mapfile -t SKILLS < <(node scripts/discover_skills.js)
          for skill in "${SKILLS[@]}"; do
            echo "=== package: ${skill} ==="
            (cd "$skill" && python3 scripts/package_skill.py)
          done

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t SKILLS < <(node scripts/discover_skills.js)
          for skill in "${SKILLS[@]}"; do
            cp "$skill/dist/${skill}.zip" release-assets/
            cp "$skill/dist/${skill}.manifest.json" release-assets/
          done
          node bin/tms-skills.js list > release-assets/skills-list.txt
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

      # Publish installer package to npm (keeps npm in sync with the tag).
      # Requires repository secret NPM_TOKEN (granular token, write on @topmindspace).
      # Skip quietly when the secret is not configured.
      # Treat already-published / E409 / previously-staged as success so Release stays green.
      - name: Publish to npm (idempotent)
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN not configured — skip npm publish (GitHub Release still published)."
            exit 0
          fi
          VERSION="$(node -p "require('./package.json').version")"
          PKG="@topmindspace/tms-skills"
          echo "Checking whether ${PKG}@${VERSION} is already on the registry..."
          if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PKG}@${VERSION} already on npm — skip publish (exit 0)."
            exit 0
          fi
          echo "Publishing ${PKG}@${VERSION} ..."
          set +e
          PUBLISH_LOG="$(mktemp)"
          npm publish --access public >"$PUBLISH_LOG" 2>&1
          rc=$?
          set -e
          cat "$PUBLISH_LOG"
          if [ "$rc" -eq 0 ]; then
            echo "npm publish OK: ${PKG}@${VERSION}"
            exit 0
          fi
          # Race / prior agent publish: treat conflict as success
          if grep -Eqi 'E409|Cannot publish over previously published|previously staged|EPUBLISHCONFLICT|cannot publish over existing' "$PUBLISH_LOG"; then
            echo "npm publish conflict (E409 / already staged|published) for ${PKG}@${VERSION} — treating as success."
            exit 0
          fi
          # Double-check registry in case view raced
          if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PKG}@${VERSION} now visible on npm after conflict — success."
            exit 0
          fi
          echo "npm publish failed with exit ${rc} (not an already-published conflict)." >&2
          exit "$rc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Keep only the 2 most recent GitHub Releases (API delete only).
      # Policy: 定期清理历史 Releases，最多保留 2 个最近版本；git tags 保留不删。
      # Do NOT run `git push origin :refs/tags/...` — tags stay for history / npm pin.
      - name: Prune old releases (keep 2; tags retained)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          KEEP=2
          mapfile -t ids < <(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq 'sort_by(.published_at // .created_at) | reverse | .[] | "\(.id)\t\(.tag_name)"')
          echo "found ${#ids[@]} release(s); keeping newest ${KEEP}; tags retained"
          i=0
          for row in "${ids[@]}"; do
            i=$((i + 1))
            if [ "$i" -le "$KEEP" ]; then
              echo "keep  $row"
              continue
            fi
            id="${row%%$'\t'*}"
            tag="${row#*$'\t'}"
            echo "prune release id=${id} tag=${tag} (tag retained)"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done
